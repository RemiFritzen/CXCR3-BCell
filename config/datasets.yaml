# -*- coding: utf-8 -*-
# datasets.yaml
# Dataset registry for the B-cell zinc / CXCR3 pipeline.
# Structure:
#   - datasets.<NAME>.patients  -> loop over per-patient .h5ad files
#   - datasets.<NAME> (no patients) -> load a single global .h5ad
# Paths are reconstructed as:  data/processed/<DATASET_NAME>/<PATIENT_KEY>.h5ad
# No explicit path field is needed unless the file deviates from this convention.

gating:
 
  # Optional: override the marker lists in `markers:` for gating specifically.
  # Leave commented out to use the `markers:` lists (recommended -- one source
  # of truth, and it matches the Methods).
  #
  # bcell_markers: [CD19, MS4A1, CD79A, CD79B, CD74, IGHM, IGHD, IGKC, IGLC2]
  # nonb_markers:  [CD3D, CD3E, TRAC, ...]
 
  nonb_filter:
 
    # Master switch. false == step 2 never runs, and the log says so
    # explicitly ("Step2: SKIPPED"). Set true only once you have confirmed
    # which gate produced the published numbers.
    enabled: false
 
    # Fraction of B-marker-positive cells KEPT. 0.7 drops the top 30% by
    # non-B score -- the published setting, if the filter ran at all.
    #
    # This is a QUANTILE, not a threshold: it removes exactly (1 - keep_frac)
    # of cells whether or not any are contaminated. At 0.7 that is ~30%, well
    # above the expected 10x multiplet rate (~4-8%), so describe it as a
    # conservative purity filter, never as doublet removal.
    keep_frac: 0.7
 
    # Population over which the quantile is computed.
    #   dataset -- one threshold per dataset, pooling PB+CSF and MS+HC.
    #              Original behaviour. Removes (1 - keep_frac) of the dataset
    #              but NOT of each arm: if CSF carries more ambient non-B
    #              signal, more CSF cells are dropped, putting a
    #              compartment-biased filter upstream of the PB-vs-CSF test.
    #   tissue  -- one threshold per tissue; PB and CSF each lose the same
    #              fraction by construction. The safer choice if the
    #              per-stratum removal rates come back uneven.
    #   sample  -- one threshold per patient x tissue.
    scope: dataset
 
    # How the non-B score is computed.
    #   mean_raw      -- mean raw count across non-B markers. Original.
    #                    Computed pre-normalisation, so it scales with library
    #                    depth: part of what it removes is just deep cells.
    #   frac_of_total -- same signal as a fraction of the cell's total counts,
    #                    which removes that depth confound. Use as a
    #                    sensitivity check, not as a silent switch.
    score_mode: mean_raw

