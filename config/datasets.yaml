# --------------------------------------------------------------------------
# Analysis markers
# --------------------------------------------------------------------------
markers:
  cxcr3: CXCR3
  zinc_transporters:
    - SLC39A1
    - SLC39A4
    - SLC39A6
    - SLC39A7
    - SLC39A9
    - SLC39A10
    - SLC39A11
    - SLC39A14    # expressed but sparse; mainly CSF-biased
    - SLC30A1     # expressed but sparse
    - SLC30A9
  metallothioneins:
    - MT1E
    - MT1F
    - MT1X
    - MT2A

  # Genes to exclude from older panels because they are essentially off
  # in CXCR3+ PB and CSF B cells in the merged dataset:
  exclude_artefacts:
    - MT1A
    - MT1G
    - MT1H
    - MT1M
    - SLC30A3   # ZnT3 - NEURONAL ONLY, not B cells
    - SLC30A2   # ZnT2 - mammary/intestinal
    - SLC30A8   # ZnT8 - pancreatic beta cells only
  bcell_markers:
    - CD19
    - MS4A1
    - CD79A
    - CD79B
  nonb_markers:
    # T / NK
    - CD3D
    - CD3E
    - TRAC
    - TRBC1
    - TRBC2
    - NKG7
    - GNLY
    - PRF1
    # Mono / myeloid
    - LST1
    - LILRB1
    - LILRB2
    - S100A8
    - S100A9
    - LYZ
    - FCGR3A
    - C1QA
    - C1QB
    - C1QC
    # Erythroid / megakaryocyte
    - HBB
    - HBA1
    - HBA2
    - PF4
    - PPBP